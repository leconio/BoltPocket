packages:
  - "app"
  - "packages/*"
allowBuilds:
  "@google/genai": false
  "@nestjs/core": false
  "@mongodb-js/zstd": false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  unrs-resolver: true
  workerd: true
auditConfig:
  # No fixed release exists. Both advisories are mitigated by the checked-in
  # image-size patch and the security:patches:check regression test.
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
minimumReleaseAgeExclude:
  - tsx@4.23.5
overrides:
  "file-type@>=20.0.0 <21.3.2": 21.3.4
  "multer@>=2.0.0 <2.2.0": 2.2.0
  "nanoid@>=3.0.0 <3.3.17": 3.3.18
  "path-to-regexp@>=8.0.0 <8.4.0": 8.4.2
  "undici@>=8.0.0 <8.9.0": 8.10.0
  "uuid@>=7.0.0 <11.1.1": 11.1.1
patchedDependencies:
  "@earendil-works/pi-coding-agent@0.83.0": patches/@earendil-works__pi-coding-agent@0.83.0.patch
  expo-camera@57.0.3: patches/expo-camera@57.0.3.patch
  expo-file-system@57.0.2: patches/expo-file-system@57.0.2.patch
  image-size@1.2.1: patches/image-size@1.2.1.patch
  react-native-background-actions@4.1.0: patches/react-native-background-actions@4.1.0.patch
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch
